<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Bitácora PG</title>
<meta name="description" content="Tu app personal: entreno, nutrición, salud, diario, finanzas y calma.">
<meta name="theme-color" content="#2f6b4f">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">

<meta name="mobile-web-app-capable" content="yes">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;600;700;800&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: calm personal dashboard — module rail on the left (selector on phones), soft cards, themeable tokens (overridden at runtime by the user's chosen aesthetic) */
:root{
  --paper:#eef1ec; --sheet:#fbfcfa; --ink:#18221b; --muted:#5d6b61; --line:#d5ddd5; --soft:#e3e9e2;
  --accent:#2f6b4f; --accent-ink:#ffffff; --hi:#b5791f;
  --ok:#2d7a4c; --warn:#a86c10; --crit:#b13636; --info:#3d6f8f; --badge-ink:#ffffff;
  --f-display:"Fraunces",Georgia,"Times New Roman",serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:14px; --fs:15px; --pad:16px; --gap:14px; --dw:700;
  --shadow:0 1px 2px rgba(20,25,30,.05),0 6px 20px rgba(20,25,30,.07); --cb:#e7ece6;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0f1511; --sheet:#161e19; --ink:#e3ebe5; --muted:#93a398; --line:#26332b; --soft:#1c2620;
  --accent:#6fbf95; --accent-ink:#0b1a12; --hi:#e3ad55;
  --ok:#5cbf86; --warn:#e2b04a; --crit:#ec7a7a; --info:#7ab3d6; --badge-ink:#1a0b0b; --cb:#1f2a23; --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0f1511; --sheet:#161e19; --ink:#e3ebe5; --muted:#93a398; --line:#26332b; --soft:#1c2620;
  --accent:#6fbf95; --accent-ink:#0b1a12; --hi:#e3ad55;
  --ok:#5cbf86; --warn:#e2b04a; --crit:#ec7a7a; --info:#7ab3d6; --badge-ink:#1a0b0b; --cb:#1f2a23; --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font:var(--fs)/1.55 var(--f-body);transition:background .25s}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--sheet)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{text-align:right;white-space:nowrap}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100%}
.rail{background:var(--sheet);border-right:1px solid var(--line);padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:18px}
.brand{font-family:var(--f-display);font-stretch:118%;font-weight:var(--dw);font-size:22px;letter-spacing:-.01em;line-height:1}
.brand small{display:block;font-family:var(--f-mono);font-weight:400;font-size:11px;color:var(--muted);letter-spacing:.06em;margin-top:6px;font-stretch:100%}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;justify-content:flex-start;align-items:center;gap:8px;padding:8px 12px;border-radius:calc(var(--r)*.7);text-decoration:none;color:var(--ink);font-weight:500}
.nav a .badge{margin-left:auto}
.nav a .code{font-family:var(--f-mono);font-size:11px;color:var(--muted);letter-spacing:.04em}
.nav a:hover{background:var(--soft)}
.nav a[aria-current="page"]{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent);font-weight:700}
.nav a[aria-current="page"] .code{color:inherit;opacity:.8}
.nav .badge{font-family:var(--f-mono);font-size:11px;background:var(--crit);color:var(--badge-ink);border-radius:9px;padding:0 6px}
.who{margin-top:auto;font-size:12px;color:var(--muted);word-break:break-all}
.who b{display:block;color:var(--ink);font-weight:600}
main{min-width:0;padding-block:24px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--f-display);font-stretch:112%;font-weight:var(--dw);letter-spacing:-.01em;font-size:clamp(26px,4vw,36px);line-height:1.05;margin:2px 0 0;text-wrap:balance}
h2{font-family:var(--f-display);font-stretch:108%;font-weight:var(--dw);font-size:18px;margin:0;text-wrap:balance}
.sec{background:var(--sheet);border:1px solid var(--cb);box-shadow:var(--shadow);border-radius:var(--r);padding:var(--pad);display:flex;flex-direction:column;gap:12px;min-width:0}
.sec-h{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:20px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,165px),1fr));gap:var(--gap)}
.kpi{background:var(--sheet);border:1px solid var(--cb);box-shadow:var(--shadow);border-radius:var(--r);padding:calc(var(--pad) - 2px);display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi .l{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.kpi .v{font-family:var(--f-display);font-stretch:105%;font-weight:var(--dw);font-size:24px;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi .s{font-size:12px;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--sheet);border-radius:max(6px,calc(var(--r)*.7));transition:border-color .15s,background .15s;padding:7px 12px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:3px 9px;font-size:13px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent)}
.btn.danger{color:var(--crit)}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tw{overflow-x:auto;margin:0 -4px;padding:0 4px}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-family:var(--f-mono);font-weight:500;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid var(--soft);vertical-align:middle}
tr.done td{color:var(--muted)} tr.done td.t{text-decoration:line-through}
tr.click{cursor:pointer} tr.click:hover td{background:var(--soft)}
.pill{display:inline-block;font-family:var(--f-mono);font-size:11px;font-weight:500;padding:1px 7px;border-radius:10px;border:1px solid currentColor;white-space:nowrap}
.c-ok{color:var(--ok)} .c-warn{color:var(--warn)} .c-crit{color:var(--crit)} .c-info{color:var(--info)} .c-mut{color:var(--muted)}
.alerts{display:flex;flex-direction:column;gap:6px;list-style:none;margin:0;padding:0}
.alerts li{display:grid;grid-template-columns:4px 1fr auto;gap:10px;align-items:center;padding:8px 10px 8px 0;background:var(--paper);border-radius:var(--r)}
.alerts li::before{content:"";align-self:stretch;border-radius:2px;background:var(--info)}
.alerts li.warn::before{background:var(--warn)} .alerts li.crit::before{background:var(--crit)} .alerts li.ok::before{background:var(--ok)}
.alerts .m{font-size:14px;min-width:0}
.bar{position:relative;height:10px;background:var(--soft);border-radius:5px;overflow:hidden}
.bar>i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:5px}
.bar>i.warn{background:var(--warn)} .bar>i.crit{background:var(--crit)}
.bar>b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink)}
.brow{display:grid;grid-template-columns:minmax(90px,150px) 1fr minmax(120px,auto);gap:10px;align-items:center;font-size:13px}
.empty{padding:20px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r);font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);border-radius:14px;padding:3px 11px;font-size:13px;cursor:pointer;background:transparent}
.chip[aria-pressed="true"],.chip[aria-selected="true"]{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
input[type=checkbox]{width:17px;height:17px;accent-color:var(--accent);cursor:pointer}
.inp{border:1px solid var(--line);border-radius:max(6px,calc(var(--r)*.6));background:var(--paper);padding:6px 9px;min-width:0}
.inp.n{width:90px;text-align:right;font-family:var(--f-mono)}
.ai{white-space:normal;font-size:14px;line-height:1.6;max-width:75ch}
.ai p{margin:0 0 8px} .ai ul{margin:0 0 8px;padding-left:20px}
.ai table{margin:6px 0 10px;font-size:13px}
.note{font-size:12px;color:var(--muted)}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font:11px var(--f-mono)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.log{display:flex;flex-direction:column;gap:10px}
.msg{padding:10px 12px;border-radius:var(--r);background:var(--paper);max-width:100%}
.msg.me{background:var(--soft);align-self:flex-end;max-width:85%}
.msg .k{font-family:var(--f-mono);font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px}
.gate{max-width:520px;margin:12vh auto;padding:24px}
/* modal */
.ov{position:fixed;inset:0;background:rgba(10,18,22,.45);z-index:50;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:max(24px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.modal{background:var(--sheet);border:1px solid var(--cb);box-shadow:0 20px 50px rgba(0,0,0,.25);border-radius:var(--r);width:min(560px,100%);padding:18px;display:flex;flex-direction:column;gap:12px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:10px 14px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f.wide{grid-column:1/-1}
.f label{font-size:12px;color:var(--muted);font-weight:500}
.f .inp{width:100%}
.f.cb{flex-direction:row;align-items:center;gap:8px}
.fab{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--accent);color:var(--accent-ink);border:0;border-radius:24px;padding:12px 18px;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.25);cursor:pointer}
.excards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:12px}
.excard{border:1px solid var(--cb);box-shadow:var(--shadow);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--sheet);min-width:0}
.excard h3{margin:0;font-family:var(--f-display);font-weight:var(--dw);font-stretch:105%;font-size:17px;line-height:1.2;text-wrap:balance}
.exvis{display:grid;grid-template-columns:1fr 92px;gap:6px;align-items:center;background:var(--paper);border-radius:var(--r);padding:6px}
.exfig{display:block;max-width:100%;height:auto}
.mmap{width:92px;height:auto} .mmap text{font-family:var(--f-mono);fill:var(--muted)}
.excard details summary{cursor:pointer;font-size:13px;color:var(--accent)}
.excard ul{margin:6px 0 0;padding-left:18px;font-size:13px}
.exhero{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:12px;align-items:center;background:var(--paper);border-radius:var(--r);padding:10px}
.exhero .exmap{display:flex;flex-direction:column;gap:8px;align-items:center}
.exhero .mmap{width:min(100%,220px)}
.exbig .exfig{width:100%;max-width:340px;margin:0 auto}
.exdet ol li,.exdet ul li{margin-bottom:4px;font-size:14px}
.restbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:70;background:var(--ink);color:var(--sheet);border-radius:28px;padding:8px 10px 8px 18px;display:flex;align-items:center;gap:12px;box-shadow:0 6px 18px rgba(0,0,0,.3);max-width:calc(100% - 32px)}
.restbar b{font-size:22px} .restbar .btn{background:transparent;color:var(--sheet);border-color:currentColor}
@media (max-width:560px){ .exhero{grid-template-columns:1fr} }
.hero{display:flex;flex-direction:column;gap:12px;padding-block:8px}
.hero h1{font-size:clamp(30px,5vw,46px)}
.quote{margin:0;padding:18px 20px;border-left:3px solid var(--hi);background:var(--sheet);border-radius:0 var(--r) var(--r) 0;max-width:70ch}
.quote p{margin:0;font-family:var(--f-display);font-stretch:100%;font-weight:500;font-size:clamp(19px,2.6vw,24px);line-height:1.35;text-wrap:balance}
.quote footer{margin-top:8px;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.posit{padding:12px 16px;border-radius:var(--r);background:color-mix(in srgb,var(--ok) 12%,var(--sheet));border:1px solid color-mix(in srgb,var(--ok) 35%,transparent);font-size:15px}
.posit.warnbg{background:color-mix(in srgb,var(--warn) 12%,var(--sheet));border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
.splash{position:fixed;inset:0;z-index:80;background:var(--paper);display:flex;align-items:center;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));transition:opacity .4s}
.splash.out{opacity:0}
.splbox{max-width:620px;display:flex;flex-direction:column;gap:16px}
.medov{align-items:center}
.medbox{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:24px;width:min(460px,100%);display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center}
.medcirc{width:min(220px,60vw);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 40% 35%,color-mix(in srgb,var(--accent) 55%,var(--sheet)),var(--accent));transform:scale(.55);transition:transform .1s linear;max-width:100%}
.medph{font-family:var(--f-display);font-size:24px;font-weight:700}
.diario .log{max-height:none}
.daysep{align-self:center;font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:6px 0}
.dimg{max-width:min(100%,360px);border-radius:var(--r);display:block;margin-bottom:6px}
.daud{width:min(100%,320px)}
.composer{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.composer textarea{width:100%}
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,180px),1fr));gap:var(--gap)}
.swatch{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:10px;background:var(--sp);color:var(--si);border:2px solid transparent;cursor:pointer;text-align:left;box-shadow:var(--shadow)}
.swatch.on{border-color:var(--accent)}
.sw-top{display:grid;grid-template-columns:repeat(6,1fr);width:100%;height:34px;border-radius:6px;overflow:hidden}
.sw-top i{display:block}
.sw-name{font-size:18px;font-weight:700} .sw-desc{font-size:12px;opacity:.75}
input[type=range]{accent-color:var(--accent);width:100%}
input[type=color].inp{height:38px;padding:3px;width:100%}
.ico{flex:none;display:block}
.nav{overflow-y:auto;min-height:0;flex:1 1 auto}
.navsearch{display:flex;align-items:center;gap:8px;margin-top:8px;padding:8px 12px;border:1px dashed var(--line);border-radius:calc(var(--r)*.7);background:transparent;color:var(--muted);cursor:pointer;font-size:13px}
.navsearch kbd{margin-left:auto;font-family:var(--f-mono);font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 5px}
.fab{display:flex;align-items:center;gap:6px}
.tabbar{display:none}
.rings{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:var(--gap);text-align:center}
.ring{display:flex;flex-direction:column;align-items:center;gap:2px}
.ring svg{max-width:100%}
.ringv{fill:var(--ink);font:600 15px var(--f-mono)}
.ring b{font-size:14px;margin-top:4px}
.sheetov{align-items:flex-end;padding:0}
.sheet{background:var(--sheet);width:min(640px,100%);border-radius:calc(var(--r) + 6px) calc(var(--r) + 6px) 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;box-shadow:0 -10px 40px rgba(0,0,0,.25)}
.qagrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:10px}
.qa{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:84px;padding:10px 6px;border:1px solid var(--cb);border-radius:var(--r);background:var(--paper);color:var(--ink);cursor:pointer;font-size:13px;text-align:center;line-height:1.25}
.qa:hover,.qa.on{border-color:var(--accent);color:var(--accent)}
.qa .ico{color:var(--accent)}
.palette{width:min(560px,100%);margin-top:10vh}
.pal-list{display:flex;flex-direction:column;gap:2px}
.pal-item{text-align:left;padding:9px 12px;border:0;background:transparent;border-radius:calc(var(--r)*.6);cursor:pointer;color:var(--ink)}
.pal-item:hover,.pal-item.on{background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--accent)}
#view.enter>*{animation:rise .32s cubic-bezier(.2,.7,.2,1) both}
#view.enter>*:nth-child(2){animation-delay:.03s} #view.enter>*:nth-child(3){animation-delay:.06s} #view.enter>*:nth-child(4){animation-delay:.09s}
@keyframes rise{from{opacity:.4;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (max-width:820px){
  .navsel{display:none!important}
  .fab{display:none}
  main{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);align-items:end;position:fixed;left:0;right:0;bottom:0;z-index:45;background:color-mix(in srgb,var(--sheet) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--cb);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  .tabbar>button{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:transparent;color:var(--muted);font-size:11px;padding:4px 2px;cursor:pointer;min-width:0}
  .tabbar>button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tabbar>button[aria-current="page"]{color:var(--accent);font-weight:700}
  .tabbar .tb-plus{justify-self:center;width:54px;height:54px;border-radius:50%;background:var(--accent);color:var(--accent-ink);justify-content:center;margin-top:-22px;box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 45%,transparent)}
  .tb-dot{position:absolute;top:2px;right:calc(50% - 16px);width:8px;height:8px;border-radius:50%;background:var(--crit)}
  .restbar{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  body .toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
}
@media (prefers-reduced-motion:reduce){#view.enter>*{animation:none}}
.welcome .splbox{gap:20px}
.lead2{font-size:18px;color:var(--muted);margin:0;max-width:56ch}

<script src="firebase-config.js"></script>
<script>
/* ===== Puente Firebase: sustituye al entorno de Claude (login, base de datos, descargas) ===== */
window.NOAI = true;
(function(){
  const cfg = window.FIREBASE_CONFIG || {};
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const LOGO = '<i><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 3h11a2 2 0 0 1 2 2v16H8a2 2 0 0 1-2-2z"/><path d="M6 17a2 2 0 0 1 2-2h11"/></svg></i>';
  const overlay = html => { let o = document.getElementById("authOv"); if(!o){ o = document.createElement("div"); o.id = "authOv"; o.className = "authov"; document.body.appendChild(o); } o.innerHTML = html; o.hidden = false; return o; };
  const hide = () => { const o = document.getElementById("authOv"); if(o) o.hidden = true; };
  const notConfigured = !cfg.apiKey || /PEGA_AQUI/.test(cfg.apiKey) || typeof firebase === "undefined";
  const ready = new Promise(res => {
    const start = () => {
      if(notConfigured){
        overlay(`<div class="authbox"><div class="authlogo">${LOGO}Bitácora PG</div><div class="card"><h2>Falta conectar la base de datos</h2>
          <p class="note" style="font-size:14px">${typeof firebase==="undefined" ? "No se pudo cargar Firebase: revisa tu conexión a internet y recarga la página." : "La app aún no tiene su configuración de Firebase. Quien la administra debe pegar los datos del proyecto en <code>app/firebase-config.js</code> (los pasos están en el README del repositorio)."}</p>
          <button class="btn" onclick="location.reload()">Reintentar</button></div></div>`);
        return;
      }
      firebase.initializeApp(cfg);
      const fdb = firebase.firestore();
      try{ fdb.settings({ignoreUndefinedProperties:true}); }catch(_){}
      try{ fdb.enablePersistence({synchronizeTabs:true}).catch(()=>{}); }catch(_){}
      const auth = firebase.auth();
      try{ auth.useDeviceLanguage(); }catch(_){}
      auth.getRedirectResult().catch(e => { window.__authErr = e; });
      window.bpgSignOut = () => auth.signOut().then(() => location.reload());
      let mode = "entrar";
      const msg = e => ({"auth/invalid-credential":"Correo o contraseña incorrectos.","bpg/wrong-pass":"Esa cuenta ya existe y la contraseña no coincide. Pulsa «¿Has olvidado la contraseña?» para cambiarla.","auth/wrong-password":"Correo o contraseña incorrectos.","auth/user-not-found":"No existe una cuenta con ese correo.","auth/email-already-in-use":"Ya existe una cuenta con ese correo: entra en «Entrar».","auth/weak-password":"La contraseña debe tener al menos 6 caracteres.","auth/invalid-email":"El correo no es válido.","auth/too-many-requests":"Demasiados intentos. Espera unos minutos.","auth/network-request-failed":"Sin conexión. Revisa internet e inténtalo de nuevo.","auth/popup-closed-by-user":"Has cerrado la ventana de Google antes de terminar.","auth/cancelled-popup-request":"Ya hay una ventana de Google abierta.","auth/popup-blocked":"El navegador bloqueó la ventana de Google: permite ventanas emergentes para esta página.","auth/operation-not-allowed":"Este método de acceso no está activado en Firebase (Authentication → Sign-in method).","auth/unauthorized-domain":"Este dominio no está autorizado en Firebase (Authentication → Settings → Authorized domains)."}[e && e.code] || (e && e.message) || "No se pudo completar. Inténtalo de nuevo.") + (e && e.code && !String(e.code).startsWith("bpg/") ? ` [${e.code}]` : "");
      const draw = (err="", info="") => {
        const o = overlay(`<div class="authbox"><div class="authlogo">${LOGO}Bitácora PG</div>
          <p class="note" style="font-size:15px;margin:0">Tu día entero en un solo sitio: entreno, nutrición, salud, diario, dinero y calma. Tus datos son privados.</p>
          <div class="card"><div class="chips" role="tablist"><button class="chip" data-m="entrar" aria-pressed="${mode==="entrar"}">Entrar</button><button class="chip" data-m="crear" aria-pressed="${mode==="crear"}">Crear cuenta</button></div>
          <form id="authF" class="authbox" style="gap:10px" novalidate>
            ${mode==="crear"?'<label class="note" for="auName">Tu nombre</label><input class="inp" id="auName" autocomplete="given-name" placeholder="Nombre">':""}
            <label class="note" for="auMail">Correo</label><input class="inp" id="auMail" type="email" autocomplete="email" inputmode="email" required>
            <label class="note" for="auPass">Contraseña</label><input class="inp" id="auPass" type="password" autocomplete="${mode==="crear"?"new-password":"current-password"}" minlength="6" required>
            <div class="err" role="alert">${esc(err)}</div>${info?`<div class="note c-ok" style="font-size:14px">${esc(info)}</div>`:""}
            <button class="btn pri" type="submit">${mode==="crear"?"Crear cuenta":"Entrar"}</button>${mode==="entrar"?'<p class="note" style="margin:0">¿Primera vez? Escribe tu correo y una contraseña nueva (mínimo 6 caracteres): la cuenta se crea sola y te llegará un correo para verificarla.</p>':""}
          </form>
          ${mode==="entrar"?'<button class="btn ghost" id="auReset" type="button">¿Has olvidado la contraseña?</button>':""}
          <div class="or">o</div><button class="btn" id="auGoogle" type="button">Continuar con Google</button></div>
          <p class="note" style="margin:0">App privada: solo pueden entrar los correos autorizados por el administrador. Cada persona tiene su propio espacio y nadie más ve sus datos.</p></div>`);
        o.querySelectorAll("[data-m]").forEach(b => b.onclick = () => { mode = b.dataset.m; draw(); });
        o.querySelector("#authF").onsubmit = async e => { e.preventDefault();
          const mail = o.querySelector("#auMail").value.trim(), pass = o.querySelector("#auPass").value;
          if(!mail || pass.length < 6) return draw(!mail ? "Escribe tu correo." : "La contraseña debe tener al menos 6 caracteres.");
          const btn = o.querySelector('button[type="submit"]'); btn.disabled = true; btn.textContent = "Un momento…"; const dog2 = setTimeout(() => draw("Sin respuesta del servidor. Revisa tu conexión e inténtalo de nuevo."), 30000);
          try{
            if(mode==="crear"){ const name = (o.querySelector("#auName").value||"").trim(); const r = await auth.createUserWithEmailAndPassword(mail, pass); if(name) await r.user.updateProfile({displayName:name}); try{ await r.user.sendEmailVerification(); }catch(_){} }
            else {
              try{ await auth.signInWithEmailAndPassword(mail, pass); }
              catch(e1){
                if(!["auth/invalid-credential","auth/user-not-found","auth/invalid-login-credentials"].includes(e1 && e1.code)) throw e1;
                // no existe la cuenta: se crea con este correo y contraseña
                try{ const r = await auth.createUserWithEmailAndPassword(mail, pass); try{ await r.user.sendEmailVerification(); }catch(_){} }
                catch(e2){ if(e2 && e2.code === "auth/email-already-in-use") throw {code:"bpg/wrong-pass"}; throw e2; }
              }
            }
            clearTimeout(dog2);
          }catch(err){ clearTimeout(dog2); draw(msg(err)); }
        };
        const rs = o.querySelector("#auReset"); if(rs) rs.onclick = async () => { const mail = o.querySelector("#auMail").value.trim(); if(!mail) return draw("Escribe tu correo y vuelve a pulsar «¿Has olvidado la contraseña?»."); try{ await auth.sendPasswordResetEmail(mail); draw("", "Te hemos enviado un correo para restablecer la contraseña."); }catch(err){ draw(msg(err)); } };
        o.querySelector("#auGoogle").onclick = async e => { const prov = new firebase.auth.GoogleAuthProvider(); prov.setCustomParameters({prompt:"select_account"});
          const b = e.currentTarget; b.disabled = true; b.textContent = "Abriendo Google…";
          const dog = setTimeout(() => draw("Google no respondió. Prueba otra vez o entra con correo y contraseña."), 90000);
          try{ await auth.signInWithPopup(prov); clearTimeout(dog); }
          catch(err){ clearTimeout(dog);
            if(["auth/popup-blocked","auth/operation-not-supported-in-this-environment","auth/web-storage-unsupported"].includes(err && err.code)){ try{ await auth.signInWithRedirect(prov); return; }catch(e2){ return draw(msg(e2)); } }
            draw(msg(err)); } };
      };
      const ADMINS = ["pgarcia@arumani.es", "pablogarciaalvaro.im@gmail.com"];
      const mailOf = u => String(u.email || "").toLowerCase();
      const box = (title, body, btns) => overlay(`<div class="authbox"><div class="authlogo">${LOGO}Bitácora PG</div><div class="card"><h2>${title}</h2><p class="note" style="font-size:14px">${body}</p><div class="err" role="alert" id="gErr"></div>${btns}<button class="btn ghost" id="gOut" type="button">Salir y entrar con otra cuenta</button></div></div>`);
      const bindOut = o => { o.querySelector("#gOut").onclick = () => auth.signOut(); };
      let first = true, gated = false;
      const gate = async u => {
        const usesPass = (u.providerData||[]).some(p => p.providerId === "password");
        if(usesPass && !u.emailVerified){
          const o = box("Verifica tu correo", `Te hemos enviado un enlace a <b>${esc(u.email)}</b>. Ábrelo (mira también en spam) y vuelve aquí.`, '<button class="btn pri" id="gOk" type="button">Ya lo he verificado</button><button class="btn" id="gRe" type="button">Reenviar correo</button>');
          bindOut(o);
          o.querySelector("#gOk").onclick = async () => { try{ await u.reload(); await u.getIdToken(true); }catch(_){} gate(auth.currentUser); };
          o.querySelector("#gRe").onclick = async () => { try{ await u.sendEmailVerification(); o.querySelector("#gErr").textContent = "Correo reenviado."; }catch(e){ o.querySelector("#gErr").textContent = msg(e); } };
          return;
        }
        const mail = mailOf(u), admin = ADMINS.includes(mail);
        let ok = admin;
        if(!ok){ try{ ok = (await fdb.collection("acl").doc(mail).get()).exists; }catch(_){ ok = false; } }
        if(!ok){
          const o = box("Sin acceso", `La cuenta <b>${esc(u.email||"")}</b> no está autorizada. Pide al administrador que añada tu correo y vuelve a intentarlo.`, '<button class="btn pri" id="gOk" type="button">Reintentar</button>');
          bindOut(o); o.querySelector("#gOk").onclick = () => gate(u); return;
        }
        if(admin) document.body.classList.add("isadmin");
        hide(); if(!gated){ gated = true; res({u, fdb}); }
      };
      window.bpgAcl = async () => {
        if(!document.body.classList.contains("isadmin")) return;
        const me = mailOf(auth.currentUser);
        const render = async (err="") => {
          let rows = [];
          try{ rows = (await fdb.collection("acl").get()).docs.map(d => d.id).sort(); }catch(e){ err = err || msg(e); }
          const o = overlay(`<div class="authbox"><div class="authlogo">${LOGO}Gestionar acceso</div><div class="card">
            <p class="note" style="font-size:14px;margin:0">Solo estos correos pueden entrar. Administradores (siempre): ${ADMINS.map(esc).join(", ")}.</p>
            <form id="aclF" style="display:flex;gap:8px"><input class="inp" id="aclIn" type="email" placeholder="correo@ejemplo.com" autocomplete="off" required><button class="btn pri" type="submit">Añadir</button></form>
            <div class="err" role="alert">${esc(err)}</div>
            <div>${rows.length ? rows.map(m => `<div class="acl-row"><span>${esc(m)}</span><button class="btn ghost" data-del="${esc(m)}" type="button">Quitar</button></div>`).join("") : '<p class="note">Aún no has autorizado a nadie más.</p>'}</div>
            <button class="btn" id="aclX" type="button">Cerrar</button></div></div>`);
          o.querySelector("#aclX").onclick = hide;
          o.querySelector("#aclF").onsubmit = async e => { e.preventDefault(); const m = o.querySelector("#aclIn").value.trim().toLowerCase();
            if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(m)) return render("Escribe un correo válido.");
            try{ await fdb.collection("acl").doc(m).set({email:m, addedBy:me, addedAt:firebase.firestore.FieldValue.serverTimestamp()}); render(); }catch(e2){ render(msg(e2)); } };
          o.querySelectorAll("[data-del]").forEach(b => b.onclick = async () => { try{ await fdb.collection("acl").doc(b.dataset.del).delete(); render(); }catch(e2){ render(msg(e2)); } });
        };
        render();
      };
      auth.onAuthStateChanged(u => {
        if(u){ if(first){ first = false; gate(u); } else location.reload(); }
        else { if(!first) location.reload(); else draw(window.__authErr ? msg(window.__authErr) : ""); }
      });
    };
    if(document.readyState === "loading") document.addEventListener("DOMContentLoaded", start); else start();
  });
  const download = async ({filename, data}) => {
    const b = data instanceof Blob ? data : new Blob([data], {type: /\.json$/.test(filename) ? "application/json" : /\.csv$/.test(filename) ? "text/csv;charset=utf-8" : "application/octet-stream"});
    const a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = filename; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500); return {status:"saved"};
  };
  window.claude = { use: async name => {
    const {u, fdb} = await ready;
    if(name === "db") return fdb;
    if(name === "user") return { id: async () => u.uid, isOwner: async () => false, canEdit: async () => true,
      me: async () => ({id:u.uid, name: u.displayName || (u.email||"").split("@")[0], email: u.email, isOwner:false, canEdit:true}) };
    if(name === "downloads") return { save: download };
    return null;
  }};
  /* botón «Instalar» (Android y escritorio) */
  window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); window.__installEvt = e; });
})();

</script>

<script>
(() => {
"use strict";
/* ---------- utilidades ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
const dkey = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseD = k => { const [y,m,d] = String(k).split("-").map(Number); return new Date(y, (m||1)-1, d||1); };
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const today = () => dkey(new Date());
const diffDays = (a,b) => Math.round((parseD(a) - parseD(b)) / 864e5);
const monthKey = k => String(k).slice(0,7);
const dow = d => (d.getDay()+6)%7 + 1; // 1=lun
const weekStart = k => { const d = parseD(k); return dkey(addDays(d, 1-dow(d))); };
const isoWeek = d => { const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); const n = t.getUTCDay()||7; t.setUTCDate(t.getUTCDate()+4-n); const y0 = new Date(Date.UTC(t.getUTCFullYear(),0,1)); return Math.ceil(((t-y0)/864e5+1)/7); };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const num = v => { const n = parseFloat(v); return isFinite(n) ? n : 0; };
const E0 = new Intl.NumberFormat("es-ES",{style:"currency",currency:"EUR",maximumFractionDigits:0});
const E2 = new Intl.NumberFormat("es-ES",{style:"currency",currency:"EUR",minimumFractionDigits:2,maximumFractionDigits:2});
const N1 = new Intl.NumberFormat("es-ES",{maximumFractionDigits:1});
const P1 = v => (v>=0?"+":"") + N1.format(v) + " %";
const fmtDate = k => { if(!k) return "—"; const d = parseD(k); return d.toLocaleDateString("es-ES",{day:"2-digit",month:"short"}); };
const rel = k => { if(!k) return ""; const n = diffDays(k, today()); if(n===0) return "hoy"; if(n===1) return "mañana"; if(n===-1) return "ayer"; return n<0 ? `hace ${-n} d` : `en ${n} d`; };
const sum = (a,f) => a.reduce((s,x)=>s+(f?f(x):x),0);
let toastT;
function toast(m){ let t = $(".toast"); if(!t){ t=document.createElement("div"); t.className="toast"; document.body.appendChild(t);} t.textContent=m; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true,2600); }

/* ---------- modelo ---------- */
const COLS = {tareas:"tareas", entrenos:"entrenos", compras:"compras", movs:"movimientos", pos:"posiciones", ops:"operaciones", rut:"rutina", dec:"decisiones", reglas:"reglas", salud:"salud", comidas:"comidas", notas:"notas", frases:"frases", med:"meditaciones", recetas:"recetas"};
let UID = null;
const BASE = () => `data/users/${UID}/m`, CFGDOC = () => `data/users/${UID}/config`, UIDOC = () => `data/users/${UID}/ui`;
const DEF_CFG = {
  presupuestos:{Vivienda:900,Supermercado:400,Transporte:150,Restaurantes:150,Ocio:200,Salud:60,Suscripciones:50,Otros:150},
  objetivoSesiones:4, objetivoMinutos:240, umbralPresupuesto:80, umbralDesvio:5, aportacionMensual:500, objetivoAhorro:20, idiomaIA:"español", rpeDefecto:6, rpeConfirmado:false, splash:true, positivos:true, recordMed:"08:00, 22:00",
  perfil:{horizonte:"", caidaMax:"", mesesColchon:6, colchonActual:"", gastoMensual:"", deudaCara:"", broker:"", planAhorro:false, objetivo:""}
};
const S = {tareas:[],entrenos:[],compras:[],movs:[],pos:[],ops:[],rut:[],dec:[],reglas:[],salud:[],comidas:[],notas:[],frases:[],med:[],recetas:[], rutDia:1, invTab:"cartera", sim:{inicial:0,mensual:300,anios:20,rent:5,ter:0.2,infl:2},cfg:{...DEF_CFG}, ready:{}, view:"inicio", mes:monthKey(today()), filtroT:"abiertas", proyT:"", decSel:null, chat:[]};
let db=null, sample=null, downloads=null, me=null;

function taskScore(t){
  let s = (4 - (t.prioridad||3)) * 2;
  if(t.vence){ const n = diffDays(t.vence, today()); s += n<0 ? 6 : n===0 ? 4 : n<=2 ? 2 : n<=7 ? 1 : 0; }
  if(t.estado==="en curso") s += 1;
  return s;
}

function trainStats(){
  const t = today(), ws = weekStart(t);
  const week = S.entrenos.filter(e=>e.fecha>=ws && e.fecha<=t);
  const load = days => sum(S.entrenos.filter(e=>{const n=diffDays(t,e.fecha); return n>=0 && n<days;}), e=>num(e.minutos)*num(e.rpe||rpeDef()));
  const acute = load(7), chronic = load(28)/4;
  const acwr = chronic>0 ? acute/chronic : null;
  let streak=0; for(let i=1;i<=52;i++){ const s=dkey(addDays(parseD(ws),-7*i)), e=dkey(addDays(parseD(s),6)); const n=S.entrenos.filter(x=>x.fecha>=s&&x.fecha<=e).length; if(n>=S.cfg.objetivoSesiones) streak++; else break; }
  return {sesiones:week.length, minutos:sum(week,e=>num(e.minutos)), km:sum(week,e=>num(e.km)), acwr, streak};
}
function monthStats(mk){
  const ms = S.movs.filter(m=>monthKey(m.fecha)===mk);
  const ing = sum(ms.filter(m=>m.tipo==="ingreso"),m=>num(m.importe));
  const gas = sum(ms.filter(m=>m.tipo!=="ingreso"),m=>num(m.importe));
  const porCat = {}; ms.filter(m=>m.tipo!=="ingreso").forEach(m=>{ porCat[m.categoria||"Otros"]=(porCat[m.categoria||"Otros"]||0)+num(m.importe); });
  return {ms, ing, gas, ahorro:ing-gas, tasa: ing>0 ? (ing-gas)/ing*100 : null, porCat};

const keyOf = x => String(x||"").trim().toUpperCase();
function holdings(){
  const H = {}; const ops = S.ops.slice().sort((a,b)=>String(a.fecha).localeCompare(String(b.fecha)));
  for(const o of ops){
    const k = keyOf(o.isin||o.ticker||o.nombre); if(!k) continue;
    const h = H[k] = H[k] || {lots:[], realized:[], div:0, ret:0, fees:0, n:0, last:0, nombre:o.nombre};
    h.n++; h.fees += num(o.comision); h.ret += num(o.retencion);
    if(o.tipo==="compra"){ const u=num(o.unidades); if(u>0){ const c=(num(o.importe)||u*num(o.precio))+num(o.comision); h.lots.push({u, pu:c/u}); h.last=num(o.precio)||c/u; } }
    else if(o.tipo==="venta"){ let u=num(o.unidades); const proceeds=(num(o.importe)||u*num(o.precio))-num(o.comision); let cost=0, sold=u;
      while(u>1e-9 && h.lots.length){ const l=h.lots[0]; const t=Math.min(u,l.u); cost+=t*l.pu; l.u-=t; u-=t; if(l.u<=1e-9) h.lots.shift(); }
      h.realized.push({fecha:o.fecha, gain:proceeds-cost, uds:sold}); if(num(o.precio)) h.last=num(o.precio); }
    else if(o.tipo==="dividendo") h.div += num(o.importe);
  }
  for(const h of Object.values(H)){ h.units = sum(h.lots,l=>l.u); h.cost = sum(h.lots,l=>l.u*l.pu); h.avg = h.units>0? h.cost/h.units : 0; }
  return H;
}
function portfolio(){
  const H = holdings();
  const rows = S.pos.map(p0=>{ const h = H[keyOf(p0.ticker)] || H[keyOf(p0.nombre)]; const p = h && h.n ? {...p0, unidades:h.units, precioMedio:h.avg, precioActual: num(p0.precioActual)||h.last, fromOps:true} : p0;
    const val=num(p.unidades)*num(p.precioActual), cost=num(p.unidades)*num(p.precioMedio); return {...p,val,cost,pl:val-cost,plp:cost>0?(val-cost)/cost*100:0}; });
  const V = sum(rows,r=>r.val), C = sum(rows,r=>r.cost);
  rows.forEach(r=>{ r.peso = V>0? r.val/V*100 : 0; r.desvio = r.peso - num(r.objetivo); });
  const clases = {}; rows.forEach(r=>{ const c=r.clase||"Otros"; clases[c]=clases[c]||{val:0,obj:0}; clases[c].val+=r.val; clases[c].obj+=num(r.objetivo); });
  Object.values(clases).forEach(c=>{ c.peso = V>0? c.val/V*100:0; c.desvio=c.peso-c.obj; });
  return {rows,V,C,pl:V-C,plp:C>0?(V-C)/C*100:0,clases,objSum:sum(rows,r=>num(r.objetivo))};
}
function planAportacion(A){
  const pf = portfolio(), T = pf.V + A;
  const def = pf.rows.map(r=>Math.max(0, num(r.objetivo)/100*T - r.val)); const D = sum(def);
  return pf.rows.map((r,i)=>{ const eur = D>0 ? A*def[i]/D : A*num(r.objetivo)/Math.max(1,pf.objSum); return {r, eur, uds: num(r.precioActual)>0 ? eur/num(r.precioActual) : 0, rebal: num(r.objetivo)/100*pf.V - r.val}; });
}

function simulate({inicial,mensual,anios,rent,ter,infl}){
  const run = fee => { const r = Math.pow(1+(num(rent)-fee)/100, 1/12)-1; let v=num(inicial); const ys=[v];
    for(let m=1;m<=Math.round(num(anios))*12;m++){ v = v*(1+r) + num(mensual); if(m%12===0) ys.push(v); } return ys; };
  const a = run(num(ter)), b = run(0), aport = [...Array(a.length)].map((_,i)=>num(inicial)+num(mensual)*12*i);
  const fv = a[a.length-1], real = fv/Math.pow(1+num(infl)/100, num(anios));
  return {a, aport, fv, real, aportado: aport[aport.length-1], feeCost: b[b.length-1]-fv};
}
const TRAMOS_AHORRO = [[6000,19],[50000,21],[200000,23],[300000,27],[Infinity,30]];
function cuotaAhorro(base){ let t=0, prev=0; for(const [lim,pct] of TRAMOS_AHORRO){ if(base<=prev) break; t += (Math.min(base,lim)-prev)*pct/100; prev=lim; } return t; }
/* IRPF base del ahorro: rendimientos del capital mobiliario (RCM: dividendos, intereses) y
   ganancias/pérdidas patrimoniales (GP) se integran por separado; compensación cruzada con tope
   del 25 % del saldo positivo del otro componente; saldos negativos se arrastran 4 años. */
function taxRaw(y){
  const H = holdings(), ys = String(y);
  const ganancias = sum(Object.values(H), h=>sum(h.realized.filter(r=>String(r.fecha).startsWith(ys)), r=>r.gain));
  const dividendos = sum(S.ops.filter(o=>o.tipo==="dividendo" && String(o.fecha).startsWith(ys)), o=>num(o.importe));
  const intereses = sum(S.ops.filter(o=>o.tipo==="interes" && String(o.fecha).startsWith(ys)), o=>num(o.importe));
  const retenciones = sum(S.ops.filter(o=>String(o.fecha).startsWith(ys)), o=>num(o.retencion));
  return {ganancias, dividendos, intereses, retenciones};
}
function taxYear(y){
  const years = S.ops.map(o=>parseInt(String(o.fecha).slice(0,4))).filter(n=>n>1900);
  const y0 = Math.min(y, years.length ? Math.min(...years) : y);
  let pend = {rcm:[], gp:[]}, res = null;
  for(let yy=y0; yy<=y; yy++){
    const raw = taxRaw(yy); let rcm = raw.dividendos + raw.intereses, gp = raw.ganancias;
    const cap = {rcm: Math.max(0,rcm)*0.25, gp: Math.max(0,gp)*0.25};
    let cruz = 0, ant = 0;
    /* 1) integración y compensación del propio año */
    if(rcm<0 && gp>0){ const c=Math.min(-rcm, cap.gp); gp-=c; rcm+=c; cap.gp-=c; cruz+=c; }
    if(gp<0 && rcm>0){ const c=Math.min(-gp, cap.rcm); rcm-=c; gp+=c; cap.rcm-=c; cruz+=c; }
    /* 2) saldos negativos de los 4 años anteriores: primero mismo componente, luego el otro con el tope restante del 25 % */
    for(const k of ["rcm","gp"]) pend[k] = pend[k].filter(p=>p.y>=yy-4 && p.amt>1e-9).sort((a,b)=>a.y-b.y);
    const useP = (list, avail) => { let used=0; for(const p of list){ if(avail-used<=1e-9) break; const c=Math.min(p.amt, avail-used); p.amt-=c; used+=c; } return used; };
    if(rcm>0){ const c=useP(pend.rcm, rcm); rcm-=c; ant+=c; }
    if(gp>0){ const c=useP(pend.gp, gp); gp-=c; ant+=c; }
    if(rcm>0){ const c=useP(pend.gp, Math.min(rcm, cap.rcm)); rcm-=c; cap.rcm-=c; ant+=c; }
    if(gp>0){ const c=useP(pend.rcm, Math.min(gp, cap.gp)); gp-=c; cap.gp-=c; ant+=c; }
    /* 3) lo negativo que queda se arrastra */
    if(rcm<0){ pend.rcm.push({y:yy, amt:-rcm}); }
    if(gp<0){ pend.gp.push({y:yy, amt:-gp}); }
    const base = Math.max(0,rcm) + Math.max(0,gp), cuota = cuotaAhorro(base);
    const pendientes = [...pend.rcm.map(p=>({...p,tipo:"RCM",caduca:p.y+4})), ...pend.gp.map(p=>({...p,tipo:"GP",caduca:p.y+4}))].filter(p=>p.amt>1e-9).map(p=>({...p}));
    res = {...raw, rcmBruto: raw.dividendos+raw.intereses, compCruzada:cruz, compAnteriores:ant, rcmNeto:Math.max(0,rcm), gpNeto:Math.max(0,gp), base, cuota, pagar: cuota-raw.retenciones, pendientes, pendienteTotal: sum(pendientes,p=>p.amt)};
  }
  return res;
}

/* CSV */
function parseCSV(text){
  text = text.replace(/^﻿/,""); const first = text.split(/\r?\n/)[0]||"";
  const delim = [";",",","\t"].map(d=>[d, first.split(d).length]).sort((a,b)=>b[1]-a[1])[0][0];
  const rows=[]; let row=[], f="", q=false;
  for(let i=0;i<text.length;i++){ const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){ f+='"'; i++; } else q=false; } else f+=c; }
    else if(c==='"') q=true; else if(c===delim){ row.push(f); f=""; } else if(c==="\n"||c==="\r"){ if(c==="\r"&&text[i+1]==="\n") i++; row.push(f); f=""; if(row.some(x=>x.trim()!=="")) rows.push(row); row=[]; } else f+=c; }
  row.push(f); if(row.some(x=>x.trim()!=="")) rows.push(row);
  return {headers: (rows.shift()||[]).map(h=>h.trim()), rows};
}
function parseNumX(v){ let s=String(v??"").trim().replace(/[€$£\s ]/g,""); if(!s) return 0;
  if(s.includes(",")&&s.includes(".")){ s = s.lastIndexOf(",")>s.lastIndexOf(".") ? s.replace(/\./g,"").replace(",",".") : s.replace(/,/g,""); }
  else if(s.includes(",")){ const parts=s.split(","); s = parts.length>2 ? parts.join("") : s.replace(",","."); }
  const n=parseFloat(s); return isFinite(n)?n:0; }
function parseDateX(v){ const s=String(v||"").trim(); let m=s.match(/(\d{4})-(\d{1,2})-(\d{1,2})/); if(m) return `${m[1]}-${pad(+m[2])}-${pad(+m[3])}`;
  m=s.match(/(\d{1,2})[./-](\d{1,2})[./-](\d{2,4})/); if(m){ const y=m[3].length===2?"20"+m[3]:m[3]; return `${y}-${pad(+m[2])}-${pad(+m[1])}`; } return ""; }
const MAPF = [["fecha","Fecha",/date|fecha|datum|time|hora/],["tipo","Tipo de operación",/type|tipo|typ|transac|operaci|action|acci[oó]n/],["isin","ISIN / Ticker",/isin|ticker|symbol|s[ií]mbolo/],

  ["precio","Precio",/price|precio|kurs|cotiz/],["importe","Importe",/amount|importe|total|betrag|neto|value/],["comision","Comisión",/fee|comisi|geb[uü]hr|commission/],["retencion","Retención / impuestos",/tax|retenci|steuer|withholding|impuesto/]];
function guessMap(headers){ const used=new Set(), map={}; for(const [k,,re] of MAPF){ const i=headers.findIndex((h,ix)=>!used.has(ix) && re.test(h.toLowerCase())); map[k]=i; if(i>=0) used.add(i);} return map; }
function mapType(raw, u, amt){ const t=String(raw||"").toLowerCase();
  if(/sell|verkauf|venta|sale|vendi/.test(t)) return "venta";
  if(/divid|aussch[uü]tt|distribution/.test(t)) return "dividendo";
  if(/interest|zins|inter[eé]s/.test(t)) return "interes";
  if(/withdraw|auszahl|retirad|retiro|transfer out|payout/.test(t)) return "retirada";
  if(/deposit|einzahl|ingreso|transfer in|aportaci|top.?up/.test(t)) return "aportacion";
  if(/buy|kauf|compra|purchase|sparplan|savings|plan|saveback|round/.test(t)) return "compra";
  if(/fee|geb[uü]hr|comisi/.test(t)) return "comision";
  if(!t && u) return amt<0 ? "compra" : amt>0 ? "venta" : "";
  return ""; }
function normRows(imp){ const g = (r,k) => imp.map[k]>=0 ? r[imp.map[k]] : ""; const seen={};
  return imp.rows.map(r=>{ const u=Math.abs(parseNumX(g(r,"unidades"))), amtRaw=parseNumX(g(r,"importe")), pr=Math.abs(parseNumX(g(r,"precio")));

    const sig = [o.fecha,o.tipo,o.isin||o.nombre,o.unidades,o.importe].join("|"); seen[sig]=(seen[sig]||0)+1;
    let h=0; const str=sig+"#"+seen[sig]; for(let i=0;i<str.length;i++) h=(h*31+str.charCodeAt(i))|0;
    return {...o, id:"op_"+(h>>>0).toString(36)+"_"+o.fecha.replaceAll("-",""), ok: !!(o.fecha && o.tipo)}; }); }

  const tick=()=>{ const s=Math.max(0,Math.round((end-Date.now())/1000)); bar.innerHTML = s>0 ? `<span>Descanso</span><b class="mono">${Math.floor(s/60)}:${pad(s%60)}</b><button class="btn sm" data-act="rest" data-s="30">+30 s</button><button class="btn sm" data-act="restStop">Saltar</button>` : `<b>¡Siguiente serie!</b><button class="btn sm" data-act="restStop">Cerrar</button>`;
    if(s<=0){ clearInterval(restI); beep(); setTimeout(()=>{ if(bar && !restI) bar.hidden=true; },6000); restI=null; } };
  tick(); restI=setInterval(tick,500);
}

async function shrink(file){
  try{ const bmp = await createImageBitmap(file); const k = Math.min(1, 1600/Math.max(bmp.width,bmp.height)); const c = document.createElement("canvas"); c.width=Math.round(bmp.width*k); c.height=Math.round(bmp.height*k); c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
    return await new Promise(r=>c.toBlob(b=>r(b||file),"image/jpeg",0.85)); }catch(_){ return file; }
}
function markBought(articulos, fecha){

function decScore(d){
  const crit = d.criterios||[], ops = d.opciones||[], P = d.puntuaciones||{};
  return ops.map((o,i)=>{ const filled = crit.map((c,j)=>[c,P[`${i}_${j}`]]).filter(([,v])=>v!=null && v!=="" && num(v)>=1);
    const ws = sum(filled,([c])=>num(c.peso)); const avg = ws>0 ? sum(filled,([c,v])=>num(c.peso)*num(v))/ws : null;
    return {o, i, incompleto: filled.length<crit.length, score: avg==null ? null : Math.max(0,(avg-1)/4*100)}; });
}

/* ---------- automatizaciones ---------- */
function ruleMatches(r, k){
  const d = parseD(k);
  if(r.frecuencia==="diaria") return true;
  if(r.frecuencia==="semanal") return dow(d)===(num(r.dia)||1);
  if(r.frecuencia==="mensual"){ const last = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate(); return d.getDate()===Math.min(num(r.dia)||1,last); }
  if(r.frecuencia==="cadaN"){ const n=Math.max(1,num(r.cadaN)); const base=r.desde||k; const x=diffDays(k,base); return x>=0 && x%n===0; }
  return false;
}
function nextRun(r){ let d=addDays(new Date(),1); for(let i=0;i<400;i++){ const k=dkey(d); if((!r.desde||k>=r.desde) && ruleMatches(r,k)) return k; d=addDays(d,1);} return ""; }
async function runEngine(manual){
  const t = today(); let created = 0;
  for(const r of S.reglas){
    if(!r.activa) continue;
    let start = r.ultima ? dkey(addDays(parseD(r.ultima),1)) : (r.desde || t);
    const floor = dkey(addDays(new Date(),-62)); if(start<floor) start=floor; if(r.desde && start<r.desde) start=r.desde;
    for(let k=start; k<=t; k=dkey(addDays(parseD(k),1))){
      if(!ruleMatches(r,k)) continue;
      const id = `r_${r.id}_${k.replaceAll("-","")}`;
      if(r.tipo==="tarea"){ if(!S.tareas.some(x=>x.id===id)){ await put("tareas",{id,titulo:r.titulo||r.nombre,proyecto:r.proyecto||"",prioridad:num(r.prioridad)||2,estado:"pendiente",vence:k,horas:num(r.horas)||0,creada:t,regla:r.id}); created++; } }
      else { if(!S.movs.some(x=>x.id===id)){ await put("movs",{id,fecha:k,tipo:r.tipoMov||"gasto",categoria:r.categoria||"Otros",importe:num(r.importe),concepto:r.concepto||r.nombre,regla:r.id}); created++; } }
    }
    if(r.ultima!==t) await patch("reglas",r.id,{ultima:t});
  }
  for(const c of S.compras){ if(c.hecho && num(c.cadaDias)>0 && c.compradoEn && diffDays(t,c.compradoEn)>=num(c.cadaDias)){ await patch("compras",c.id,{hecho:false}); created++; } }
  if(manual || created) toast(created ? `Automatizaciones: ${created} elemento${created>1?"s":""} generado${created>1?"s":""}` : "Automatizaciones al día");
}

/* ---------- gráficos ---------- */
function barChart(labels, series, {target, h=190, money}={}){
  const W=640, pl=46, pr=8, pt=10, pb=24, ih=h-pt-pb, iw=W-pl-pr;
  const max = Math.max(1, target||0, ...series.flatMap(s=>s.values)) * 1.1;
  const nice = (()=>{ const raw=max/4, p=Math.pow(10,Math.floor(Math.log10(raw))), m=raw/p; return (m<=1?1:m<=2?2:m<=5?5:10)*p; })();
  const top = Math.ceil(max/nice)*nice, y = v => pt + ih - v/top*ih;
  const gw = iw/labels.length, bw = Math.min(28,(gw-8)/series.length);
  let g=""; for(let v=0; v<=top+1e-9; v+=nice){ g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--soft)"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end">${money? (v>=1000? N1.format(v/1000)+"k":Math.round(v)) : Math.round(v)}</text>`; }
  let b=""; labels.forEach((l,i)=>{ const x0 = pl + i*gw + (gw - bw*series.length)/2;
    series.forEach((s,j)=>{ const v=s.values[i]||0; const yy=y(v); b+=`<rect x="${x0+j*bw}" y="${yy}" width="${bw-2}" height="${Math.max(0,pt+ih-yy)}" rx="2" fill="${s.color}"${s.last&&i===labels.length-1?' stroke="var(--ink)" stroke-width="1.2"':""}><title>${esc(l)} · ${esc(s.name)}: ${money?E0.format(v):Math.round(v)}</title></rect>`; });
    b+=`<text x="${pl+i*gw+gw/2}" y="${h-6}" text-anchor="middle">${esc(l)}</text>`; });
  const tl = target ? `<line x1="${pl}" x2="${W-pr}" y1="${y(target)}" y2="${y(target)}" stroke="var(--hi)" stroke-dasharray="5 4" stroke-width="1.5"/>` : "";
  return `<svg class="chart" viewBox="0 0 ${W} ${h}" role="img">${g}${b}${tl}</svg>`;
}

function toCSV(rows){
  const flat = rows.map(r=>{ const o={}; for(const [k,v] of Object.entries(r)) o[k] = v!=null && typeof v==="object" ? JSON.stringify(v) : v; return o; });
  const cols = [...new Set(flat.flatMap(r=>Object.keys(r)))];
  const cell = v => { if(v==null) return ""; let x = typeof v==="number" ? String(v).replace(".",",") : String(v); return /[";\n\r]/.test(x) ? `"${x.replace(/"/g,'""')}"` : x; };
  return "﻿" + [cols.join(";"), ...flat.map(r=>cols.map(c=>cell(r[c])).join(";"))].join("\r\n");
}
/* ---------- markdown mínimo ---------- */
function md(t){
  const lines = String(t||"").split("\n"); let out="", list=false, tbl=[];
  const inl = s => esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/`([^`]+)`/g,"<code>$1</code>");
  const flushT = () => { if(!tbl.length) return; const rows = tbl.filter(r=>!/^\s*\|?\s*:?-{2,}/.test(r)).map(r=>r.trim().replace(/^\||\|$/g,"").split("|").map(c=>c.trim()));
    out += `<div class="tw"><table><thead><tr>${rows[0].map(c=>`<th>${inl(c)}</th>`).join("")}</tr></thead><tbody>${rows.slice(1).map(r=>`<tr>${r.map(c=>`<td>${inl(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`; tbl=[]; };
  for(const l of lines){
    if(/^\s*\|.*\|\s*$/.test(l)){ if(list){out+="</ul>";list=false;} tbl.push(l); continue; } else flushT();
    if(/^\s*[-*•]\s+/.test(l)){ if(!list){out+="<ul>";list=true;} out+=`<li>${inl(l.replace(/^\s*[-*•]\s+/,""))}</li>`; continue; }
    if(list){out+="</ul>";list=false;}
    if(/^#{1,4}\s/.test(l)) out+=`<p><b>${inl(l.replace(/^#+\s/,""))}</b></p>`; else if(l.trim()) out+=`<p>${inl(l)}</p>`;
  }
  flushT(); if(list) out+="</ul>"; return out;
}

async function sendChat(text){
  if(!sample){ toast("El asistente de Claude no está disponible en esta vista"); return; }
  S.chatBusy=true; S.chat.push({r:"user",t:text}); S.chat.push({r:"assistant",t:"…"}); render();
  const idx = S.chat.length-1;
  const msgs = [{role:"user",content:`${SYS()}\nPuedes usar las herramientas para registrar datos cuando el usuario lo pida. Tras usarlas, confirma en una línea qué has registrado.\n\nDATOS ACTUALES (JSON):\n${context()}`},{role:"assistant",content:"Entendido. Tengo tus datos delante."},
    ...S.chat.slice(0,-1).slice(-12).map(c=>({role:c.r==="user"?"user":"assistant",content:c.t}))];
  const upd = t => { S.chat[idx].t=t; const log=$("#chatLog"); if(log&&log.lastElementChild) log.lastElementChild.querySelector(".ai").innerHTML=md(t); };
  const btn=$("#chatBtn"); if(btn) btn.disabled=true;
  try{
    let r;
    try{ r = await sample(msgs,{tools:TOOLS(),cache:false,onText:u=>upd(u.text)}); }
    catch(e){ if(e&&e.code==="tools_unavailable") r = await sample(msgs,{cache:false,onText:u=>upd(u.text)}); else throw e; }
    upd(r.text||"Hecho.");
  }catch(e){ upd(aiErr(e)); }
  const b=$("#chatBtn"); if(b) b.disabled=false; S.chatBusy=false; saveUI();
}
async function aiDecision(id){

  const sc = decScore(d);
  try{
    const r = await sample(`${SYS()}\n\nDECISIÓN:\n${JSON.stringify({titulo:d.titulo,opciones:d.opciones,criterios:d.criterios,puntuaciones:d.puntuaciones,resultadoMatriz:sc.map(s=>({opcion:s.o,puntuacion:s.incompleto?"incompleto":Math.round(s.score)}))})}\n\nCONTEXTO PERSONAL:\n${context()}\n\nAnaliza: 1) qué opción recomienda la matriz y si es robusta (¿cambia si varías ±1 el peso del criterio más pesado?), 2) criterios que faltan o sesgos, 3) recomendación final con condición de revisión y fecha sugerida. Usa una tabla para la sensibilidad. Máximo 250 palabras.`,
      {modelTier:"complex",cache:false,onText:u=>{const o=$("#decOut"); if(o) o.innerHTML=md(u.text);}});

const DEF_FIS = {nombre:"", sexo:"", edad:"", altura:"", peso:"", actividad:"moderado", objetivo:"musculo", experiencia:"intermedio", dias:4, duracion:60, equipo:"gimnasio", comidas:4, dieta:"omnivora", alergias:"", noGusta:"", lesiones:""};
const fis = () => ({...DEF_FIS, ...(S.cfg.fis||{})});
function nutri(){
  const f = fis(), w=num(f.peso), h=num(f.altura), a=num(f.edad), G = GOALS[f.objetivo]||GOALS.salud;
  if(!w || !h || !a || !f.sexo) return {ok:false, falta:[!f.sexo&&"sexo",!a&&"edad",!h&&"altura",!w&&"peso"].filter(Boolean)};
  const imc = w/Math.pow(h/100,2);
  if(a<18) return {ok:false, menor:true, imc};
  const bmr = 10*w + 6.25*h - 5*a + (f.sexo==="hombre"?5:-161);
  const tdee = bmr*(ACT[f.actividad]||ACT.moderado)[0];
  const avisos=[]; let delta = G.kcal;
  if(delta<0 && imc<18.5){ delta=0; avisos.push("Tu IMC está por debajo de 18,5: no se aplica déficit. Consulta con un profesional antes de perder peso."); }
  let kcal = tdee*(1+delta);
  if(kcal<bmr && delta<0){ kcal=bmr; avisos.push("El objetivo se limita a tu metabolismo basal para evitar un déficit excesivo."); }
  const wRef = imc>30 ? 25*Math.pow(h/100,2) : w;
  const p = G.prot*wRef, g = kcal*0.27/9, c = Math.max(0,(kcal-p*4-g*9)/4);
  return {ok:true, imc, bmr, tdee, kcal, p, c, g, agua: w*0.035, fibra: kcal/1000*14, G, avisos, wRef};
}

const SPLITS = {
  FA:["Cuerpo completo A",["sq","bp","pd","lc","lr","cr"]], FB:["Cuerpo completo B",["lp","fl","rw","ab","cb","ca"]], FC:["Cuerpo completo C",["hk","dp","ps","lc","tp","cr"]],
  UA:["Torso A",["bp","pd","rw","lr","cb","tp"]], LA:["Pierna A",["sq","lp","lc","ab","ca","cr"]], UB:["Torso B",["fl","ps","dp","rd","ch","to"]], LB:["Pierna B",["hk","le","lc","ab","ca","cr"]],
  PU:["Empuje",["bp","fl","dp","lr","tp","to"]], PL:["Tirón",["pd","rw","rd","cb","ch","cr"]], LG:["Pierna",["sq","lp","le","lc","ab","ca"]]
};
const DAYMAP = {2:["FA","FB"],3:["FA","FB","FC"],4:["UA","LA","UB","LB"],5:["PU","PL","LG","UA","LB"],6:["PU","PL","LG","UB","PL","LA"]};
function repsFor(nombre, goal){
  const G = GOALS[goal]||GOALS.musculo, comp = (exFull(nombre).tipo==="Compuesto");
  if(goal==="fuerza") return comp ? [4,6] : [8,12];
  if(goal==="musculo" || goal==="recomp") return comp ? [6,10] : [10,15];
  return G.reps;
}
function seriesFor(goal, exp, nombre){
  let n = (GOALS[goal]||GOALS.musculo).series; if(exp==="principiante") n=Math.max(2,n-1); if(exp==="avanzado") n+=1;
  if(goal==="fuerza" && exFull(nombre).tipo!=="Compuesto") n=Math.max(2,n-1);
  return Math.min(5,n);
}
function genPlan(){
  const f = fis(), lib = EXLIB[f.equipo]||EXLIB.gimnasio, days = DAYMAP[Math.min(6,Math.max(2,num(f.dias)||4))];
  const perDay = num(f.duracion)<45 ? 4 : num(f.duracion)<=60 ? 5 : 6;
  const lesion = String(f.lesiones||"").toLowerCase();
  return days.map((k,ix)=>{ const [titulo, keys] = SPLITS[k];
    let ex = keys.map(x=>lib[x]);
    if(/rodilla/.test(lesion)) ex = ex.filter(n=>!/búlgara|zancada|extensi/i.test(n));
    if(/hombro/.test(lesion)) ex = ex.filter(n=>!/fondos|tras nuca/i.test(n));
    if(/lumbar|espalda baja/.test(lesion)) ex = ex.filter(n=>!/sentadilla en smith|sentadilla goblet con pausa/i.test(n));
    ex = ex.slice(0, perDay);
    return {dia:ix+1, titulo, ejercicios: ex.map(n=>{ const [lo,hi]=repsFor(n,f.objetivo); return {nombre:n, objetivoReps:lo, subirAl:hi, series:seriesFor(f.objetivo,f.experiencia,n)}; })};
  });
}
async function savePlan(newPlan, nombre, fuente){
  const {plan} = rutina();
  if(plan) await put("rut",{...plan, id:"plan_prev_"+today().replaceAll("-","")+"_"+Date.now().toString(36)});
  await put("rut",{...(plan||{}), id:"plan", nombre, fuente, objetivo:fis().objetivo, plan:newPlan, mediciones:(plan&&plan.mediciones)||[], actualizado:today()});
}

/* ---------- medios (fotos y audio) ---------- */
let assets = null;
async function shrinkTo(file, max=1280, q=0.82){
  try{ const bmp = await createImageBitmap(file); const k=Math.min(1,max/Math.max(bmp.width,bmp.height)); const c=document.createElement("canvas"); c.width=Math.round(bmp.width*k); c.height=Math.round(bmp.height*k); c.getContext("2d").drawImage(bmp,0,0,c.width,c.height); return await new Promise(r=>c.toBlob(b=>r(b||file),"image/jpeg",q)); }catch(_){ return file; }
}
const blobToDataURL = b => new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(b); });
async function storeMedia(blob, kind){
  if(assets){
    try{ const type = kind==="audio" ? (/webm|ogg/.test(blob.type)?"video/webm":"video/mp4") : (blob.type||"image/jpeg");
      const up = await assets.upload(kind==="audio" ? new Blob([blob],{type}) : blob, {type}); return {url: up.url, assetId: up.id}; }catch(e){ /* sigue al plan B */ }
  }
  if(kind==="foto"){ let b = blob; if(b.size>200000) b = await shrinkTo(blob, 900, 0.7); if(b.size>220000) throw new Error("La foto es demasiado grande para guardarla"); return {data: await blobToDataURL(b)}; }
  if(blob.size > 8*1024*1024) throw new Error("La nota de voz supera 8 MB");
  const durl = await blobToDataURL(blob), ref = "m_"+uid(), CH = 180000, n = Math.ceil(durl.length/CH);
  await pool([...Array(n).keys()], i => db.collection(BASE()+"/media").doc(ref+"_"+i).set({ref, i, n, d: durl.slice(i*CH,(i+1)*CH)}), 3);
  return {ref};
}
async function loadMedia(ref){
  const snap = await db.collection(BASE()+"/media").where("ref","==",ref).get();
  const parts = snap.docs.map(d=>d.data()).sort((a,b)=>a.i-b.i); return parts.map(p=>p.d).join("");
}

const PATRONES = {caja:{n:"Respiración cuadrada",f:[["Inspira",4,1],["Mantén",4,1],["Espira",4,0],["Mantén",4,0]]}, "478":{n:"Relajante 4-7-8",f:[["Inspira",4,1],["Mantén",7,1],["Espira",8,0]]}, coherente:{n:"Coherente",f:[["Inspira",5.5,1],["Espira",5.5,0]]}};
let medT=null;
function meditar(p, mins){
  const P = PATRONES[p]||PATRONES.caja, total = mins*60, t0 = Date.now(); clearInterval(medT);
  const cyc = sum(P.f,x=>x[1]);
  $("#ovroot").innerHTML = `<div class="ov medov"><div class="medbox"><div class="eyebrow">${esc(P.n)} · ${mins} min</div><div class="medcirc" id="medC"></div><div class="medph" id="medP">Prepárate</div><div class="mono" id="medR"></div><div class="row" style="justify-content:center"><button class="btn" data-act="medStop">Terminar</button></div><p class="note">Siéntate cómodo, hombros sueltos. Sigue el círculo: crece al inspirar, se mantiene, y se reduce al espirar.</p></div></div>`;
  const reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  const tick = () => { const el=(Date.now()-t0)/1000; if(el>=total){ finish(true); return; }
    let x = el % cyc, ph = P.f[0], acc=0, k=0; for(const f of P.f){ if(x < acc+f[1]){ ph=f; k=(x-acc)/f[1]; break; } acc+=f[1]; }
    const scale = ph[0]==="Inspira" ? 0.55+0.45*k : ph[0]==="Espira" ? 1-0.45*k : (ph[2]?1:0.55);
    const c=$("#medC"); if(c) c.style.transform = reduce?"none":`scale(${scale.toFixed(3)})`;
    const pp=$("#medP"); if(pp) pp.textContent = `${ph[0]} · ${Math.ceil(ph[1]-(x-acc))}`;
    const rr=$("#medR"); const left=Math.ceil(total-el); if(rr) rr.textContent = `${Math.floor(left/60)}:${pad(left%60)}`; };
  const finish = async (done) => { clearInterval(medT); medT=null; const el=Math.round((Date.now()-t0)/60000*10)/10;
    if(done) beep(); if(el>=1) await put("med",{fecha:today(), minutos:Math.round(el), tipo:P.n});
    $("#ovroot").innerHTML = `<div class="ov medov"><div class="medbox"><h2>${done?"Sesión completada":"Sesión terminada"}</h2><p>${esc(reflexHoy(3)[0])}</p><button class="btn pri" data-act="ovClose">Cerrar</button></div></div>`; };
  S._medFinish = () => finish(false);
  tick(); medT = setInterval(tick, 100);
}

/* utilidades de color */
const hx = c => { const m=/^#?([0-9a-f]{6})$/i.exec(String(c||"").trim()); return m? "#"+m[1].toLowerCase() : null; };
const rgb = h => { h=hx(h)||"#000000"; return [1,3,5].map(i=>parseInt(h.slice(i,i+2),16)); };
const toHex = a => "#"+a.map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,"0")).join("");
const mixC = (a,b,t) => { const A=rgb(a),B=rgb(b); return toHex(A.map((v,i)=>v+(B[i]-v)*t)); };
const lum = h => { const [r,g,b]=rgb(h).map(v=>{ v/=255; return v<=0.03928? v/12.92 : Math.pow((v+0.055)/1.055,2.4); }); return 0.2126*r+0.7152*g+0.0722*b; };
const contrast = (a,b) => { const x=lum(a), y=lum(b); return (Math.max(x,y)+0.05)/(Math.min(x,y)+0.05); };
const bestOn = bg => contrast(bg,"#ffffff")>=contrast(bg,"#111111") ? "#ffffff" : "#111111";
function fixPal(p, base, dark){
  const o = {...base}; for(const k of Object.keys(base)){ const v=hx(p&&p[k]); if(v) o[k]=v; }
  if(contrast(o.ink,o.paper)<7 || contrast(o.ink,o.sheet)<6) o.ink = dark ? "#f2f2f2" : "#141414";
  if(contrast(o.muted,o.sheet)<3.2) o.muted = mixC(o.ink, o.sheet, 0.4);
  if(contrast(o.accent,o.sheet)<3) o.accent = mixC(o.accent, dark?"#ffffff":"#000000", 0.35);
  o["accent-ink"] = contrast(o["accent-ink"],o.accent)>=4.5 ? o["accent-ink"] : bestOn(o.accent);
  if(contrast(o.line,o.sheet)<1.15) o.line = mixC(o.sheet, o.ink, 0.14);
  if(contrast(o.soft,o.sheet)<1.04) o.soft = mixC(o.sheet, o.ink, 0.07);
  return o;
}

  let l = document.getElementById("themeFonts"); if(!l){ l=document.createElement("link"); l.id="themeFonts"; l.rel="stylesheet"; document.head.appendChild(l); }
  if(l.href!==href) l.href = href;
}
function normTheme(t){

function themeCSS(t){

  const D = {compacta:[14,12,10],normal:[15,16,14],amplia:[16,22,18]}[t.densidad];
  const common = `--dw:${FONTS[t.fontDisplay]==="400"?400:700};--f-display:${fontStack(t.fontDisplay)};--f-body:${fontStack(t.fontBody)};--f-mono:${fontStack(t.fontMono,"mono")};--r:${t.radio}px;--fs:${D[0]}px;--pad:${D[1]}px;--gap:${D[2]}px`;

    case "recM": S.recM=el.dataset.v; render(); break;

    case "recHoy": { const r=RECETAS.find(x=>x.id===id)||S.recetas.find(x=>x.id===id); if(r){ await put("comidas",{nombre:r.n,momento:r.m,kcal:r.kcal,p:r.p,c:r.c,g:r.g,fecha:today()}); toast("Añadida a hoy"); } break; }
    case "recDel": await del("recetas",id); break;
    case "recSave": if(S._rec){ await put("recetas",{...S._rec}); toast("Receta guardada"); } break;
    case "recNewHoy": if(S._rec){ const r=S._rec; await put("comidas",{nombre:r.n,momento:r.m,kcal:num(r.kcal),p:num(r.p),c:num(r.c),g:num(r.g),fecha:today(),ia:true}); toast("Añadida a hoy"); } break;
    case "newSalud": F.salud({}); break; case "editSalud": F.salud(find("salud")); break;
    case "aiSalud": aiSalud(); break;
    case "noteIA": noteIA(id); break;
    case "noteDel": if(!el.dataset.armed){ el.dataset.armed="1"; el.textContent="Confirmar borrado"; break; } await del("notas",id); break;
    case "loadAudio": { const x=find("notas"); try{ const durl=await loadMedia(x.ref); const au=el.closest(".note-item").querySelector("audio"); au.src=durl; el.remove(); au.play().catch(()=>{}); }catch(_){ toast("No se pudo cargar el audio"); } break; }
    case "exDet": openExDetail(+el.dataset.d, +el.dataset.i); break;
    case "newMed": openMed(); break;
    case "rest": startRest(+el.dataset.s, !!el.closest("#restBar")); break;
    case "restStop": { clearInterval(restI); restI=null; const b=$("#restBar"); if(b) b.hidden=true; break; }
    case "logRut": openRutLog(); break;
    case "ticket": if(window.NOAI){ F.mov({fecha:today(),tipo:"gasto"}); break; } openTicket(); break;
    case "tkManual": $("#ovroot").innerHTML=""; F.mov({fecha:today(),tipo:"gasto"}); break;
    case "ovClose": $("#ovroot").innerHTML=""; break;
    case "newOp": F.op({}); break; case "editOp": F.op(find("ops")); break;
    case "perfil": F.perfil(); break;
    case "import": openImport(); break;
    case "impClose": $("#ovroot").innerHTML=""; IMP=null; break;
    case "impGo": el.disabled=true; await doImport(); break;
    case "askInv": go("asistente"); setTimeout(()=>sendChat("Con mi perfil de inversor, mi colchón, mi ahorro mensual y mis puntos de control, ¿estoy listo para empezar a invertir? Dime qué me falta, en qué orden hacerlo y qué preguntas debo resolver antes de elegir producto. Usa una tabla."),60); break;
    case "quick": go("asistente"); setTimeout(()=>sendChat(el.dataset.q),60); break;
    case "newT": F.tarea({}); break; case "editT": F.tarea(find("tareas")); break;
    case "toggleT": { const t=find("tareas"); await patch("tareas",id,{estado: el.checked?"hecha":"pendiente", hechaEn: el.checked?today():""}); if(el.checked) toast(`Hecho: ${t.titulo}`); break; }
    case "filtroT": S.filtroT=el.dataset.v; render(); break;
    case "proyT2": S.proyT=el.dataset.v; render(); break;
    case "newE": F.entreno({}); break; case "editE": F.entreno(find("entrenos")); break;
    case "newC": F.compra({}); break; case "editC": F.compra(find("compras")); break;
    case "buyC": await patch("compras",id,{hecho:true,compradoEn:today()}); break;
    case "unbuyC": await patch("compras",id,{hecho:false}); break;
    case "clearBought": { const xs=S.compras.filter(c=>c.hecho && !(num(c.cadaDias)>0)); for(const c of xs) await del("compras",c.id); toast(`${xs.length} eliminados`); break; }
    case "newM": F.mov({}); break; case "editM": F.mov(find("movs")); break;
    case "mes": { const d=parseD(S.mes+"-01"); d.setMonth(d.getMonth()+num(el.dataset.v)); S.mes=dkey(d).slice(0,7); render(); break; }
    case "newP": F.pos({}); break; case "editP": F.pos(find("pos")); break;
    case "newD": F.dec({}); break; case "editD": F.dec(find("dec")); break;
    case "selD": S.decSel=id; render(); window.scrollTo(0,0); break;
    case "aiDec": aiDecision(id); break;
    case "newR": F.regla({}); break; case "editR": F.regla(find("reglas")); break;
    case "toggleR": await patch("reglas",id,{activa:el.checked}); break;
    case "runEng": await runEngine(true); break;
    case "cfg": F.cfg(); break;
    case "brief": runBrief("#briefOut"); break;
    case "brief2": go("hoy"); setTimeout(()=>runBrief("#briefOut"),60); break;
    case "export": {
      const data = {exportado:new Date().toISOString(), config:S.cfg}; for(const k of Object.keys(COLS)) data[COLS[k]] = S[k];
      if(!downloads){ toast("La descarga no está disponible en esta vista"); break; }
      try{ await downloads.save({filename:`bitacora-pg-${today()}.json`, data: JSON.stringify(data,null,2)}); toast("Copia exportada"); }catch(err){ toast(err&&err.code==="declined"?"Descarga cancelada":"No se pudo exportar: "+(err.message||err.code)); }
      break; }
    case "clearChat": S.chat=[]; saveUI(); render(); break;
    case "exportCSV": {
      const k = ($("#csvCol")||{}).value || "tareas", rows = S[k]||[];
      if(!rows.length){ toast("No hay registros en ese módulo"); break; }
      if(!downloads){ toast("La descarga no está disponible en esta vista"); break; }
      try{ await downloads.save({filename:`bitacora-pg-${COLS[k]}-${today()}.csv`, data: toCSV(rows)}); toast(`CSV exportado: ${rows.length} filas`); }catch(err){ toast(err&&err.code==="declined"?"Descarga cancelada":"No se pudo exportar: "+(err.message||err.code)); }
      break; }
    case "delEx": { const xs=[]; for(const k of Object.keys(COLS)) for(const x of S[k].filter(x=>x.ejemplo)) xs.push([k,x.id]); const n = await pool(xs, ([k,id])=>del(k,id)); toast(`${n} datos de ejemplo eliminados`); break; }
  }
});
document.addEventListener("change", async e => {
  const el = e.target; const a = el.dataset && el.dataset.act;
  if(el.id==="navSel"){ go(el.value); return; }
  if(a==="volSem"){ S.volSem=+el.value; render(); return; }
  if(el.id==="qaPlato" && el.files && el.files[0]){ const f=el.files[0]; $("#ovroot").innerHTML=""; estimarComida("", await shrinkTo(f,1280,0.85)); return; }
  if((el.id==="qaFoto"||el.id==="qaVoz") && el.files && el.files[0]){ const f=el.files[0], k=el.id==="qaFoto"?"foto":"audio"; $("#ovroot").innerHTML=""; await addNote(k, f); go("diario"); return; }
  if(["tAccent","tHi","tPaper","tRad","tFD","tFB","tFM","tCard","tDen"].includes(el.id)){ tuneTema(); return; }
  if(el.id==="temaImg" && el.files && el.files[0]){ S.temaTxt=($("#temaTxt")||{}).value||""; S._temaImg = await shrinkTo(el.files[0],1024,0.8); el.value=""; render(); return; }
  if((el.id==="diaFoto"||el.id==="diaGal") && el.files && el.files[0]){ addNote("foto", el.files[0]); el.value=""; return; }
  if(el.id==="diaVoz" && el.files && el.files[0]){ addNote("audio", el.files[0]); el.value=""; return; }
  if(el.id==="platoIn" && el.files && el.files[0]){ const f=el.files[0]; el.value=""; estimarComida("", await shrinkTo(f,1280,0.85)); return; }
  if((el.id==="tkCam"||el.id==="tkGal") && el.files && el.files[0]){ readTicket(el.files[0]); el.value=""; return; }
  if(el.id==="impFile" && el.files && el.files[0]){ try{ const {headers,rows}=parseCSV(await el.files[0].text()); IMP.headers=headers; IMP.rows=rows; IMP.map=guessMap(headers); drawImport(); }catch(err){ toast("No se pudo leer el CSV"); } return; }
  if(el.id==="impBroker" && IMP){ IMP.broker=el.value.trim(); drawImport(); return; }
  if(a==="impMap" && IMP){ IMP.map[el.dataset.k]=+el.value; drawImport(); return; }
  if(a==="sim"){ S.sim[el.dataset.k]=num(el.value); render(); return; }
  if(el.id==="impIn" && el.files && el.files[0]){
    try{ const data = JSON.parse(await el.files[0].text()); let n=0;
      const xs=[]; for(const k of Object.keys(COLS)) for(const x of (data[COLS[k]]||[])){ if(x&&x.id) xs.push([k,x]); } n = await pool(xs, ([k,x])=>put(k,x));
      if(data.config) await saveCfg(data.config); toast(`Importados ${n} registros`);
    }catch(err){ toast("El archivo no es una copia válida de la bitácora"); }
    el.value=""; return;
  }
  if(a==="proyT"){ S.proyT=el.value; render(); }
  else if(a==="price"){ await patch("pos",el.dataset.id,{precioActual:num(el.value),actualizado:today()}); }
  else if(a==="aport"){ S.aport=num(el.value); saveUI(); render(); }
  else if(a==="score"){ const d=S.dec.find(x=>x.id===el.dataset.id); if(!d) return; const v=el.value===""?null:Math.max(1,Math.min(5,Math.round(num(el.value)))); const p={...(d.puntuaciones||{})}; if(v==null) delete p[el.dataset.k]; else p[el.dataset.k]=v; await patch("dec",d.id,{puntuaciones:p}); }
});
document.addEventListener("input", e => { if(e.target.id==="diaQ"){ S.diaQ=e.target.value; soon(); } });
document.addEventListener("submit", e => {
  if(e.target.id==="temaF"){ e.preventDefault(); temaIA(); return; }
  if(e.target.id==="foodQ"){ e.preventDefault(); const t=$("#foodTxt").value.trim(); if(t){ $("#foodTxt").value=""; estimarComida(t); } return; }
  if(e.target.id==="diaF"){ e.preventDefault(); if(($("#diaTxt").value||"").trim()) addNote("texto"); return; }
  if(e.target.id==="chatF"){ e.preventDefault(); const t=$("#chatIn").value.trim(); if(!t) return; $("#chatIn").value=""; sendChat(t); }
});
document.addEventListener("keydown", e => {
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==="k"){ e.preventDefault(); openPalette(); return; }
  if(e.target.id==="chatIn" && e.key==="Enter" && !e.shiftKey){ e.preventDefault(); $("#chatF").requestSubmit(); }
  if(e.key==="Escape" && $("#ovroot").innerHTML) $("#ovroot").innerHTML="";
});

/* ---------- arranque ---------- */
const onHash = () => { const h=(location.hash||"").slice(1); if(h && h!==S.view && VIEWS.some(x=>x[0]===h)) go(h, true); };
window.addEventListener("hashchange", onHash);
document.addEventListener("toggle", e => { if(e.target && e.target.id==="rutWeeks") S.rutOpen = e.target.open; }, true); window.addEventListener("popstate", onHash);
async function migrateLegacy(){
  try{
    const c = await db.doc(CFGDOC()).get(); if(c.exists && c.data().migrado) return;
    const items=[]; for(const col of Object.values(COLS)){ try{ const snap = await db.collection(col).get(); snap.docs.forEach(d=>items.push([col,d.id,d.data()])); }catch(_){} }
    const n = await pool(items, ([col,id,data])=>db.collection(BASE()+"/"+col).doc(id).set(data));
    let cfg={}; try{ const x=await db.doc("config/main").get(); if(x.exists) cfg=x.data(); }catch(_){}
    try{ const u=await db.doc("estado/ui").get(); if(u.exists) await db.doc(UIDOC()).set(u.data()); }catch(_){}
    await db.doc(CFGDOC()).set({...DEF_CFG, ...cfg, ...(c.exists?c.data():{}), migrado:true});
    if(n) toast(`Datos trasladados a tu espacio privado: ${n} registros`);
  }catch(_){}
}
function gate(msg){ $("#view").innerHTML = `<div class="gate sec"><div class="eyebrow">Acceso</div><h1>Bitácora privada</h1><p>${msg}</p></div>`; }
async function boot(){
  const h = (location.hash||"").slice(1); let v = VIEWS.some(x=>x[0]===h) ? h : null;
  if(!v){ try{ v = localStorage.getItem("bpg_view"); }catch(_){} }
  if(v && VIEWS.some(x=>x[0]===v)) S.view = v;
  render();
  const [user, dbx, smp, dl, as] = await Promise.all([claude.use("user"), claude.use("db"), claude.use("sample"), claude.use("downloads"), claude.use("assets")]);
  sample = smp; downloads = dl; assets = as;
  if(user){ try{ me = await user.me(); }catch(_){} }
  const owner = user ? await user.isOwner().catch(()=>false) : false;
  $("#who").innerHTML = me && (me.email||me.name) ? `<b>${esc(me.name||"Sesión iniciada")}</b>${esc(me.email||"")}` : "Sin sesión";
  if(!dbx){ gate("Inicia sesión para abrir tu bitácora. Tus datos se guardan en un espacio privado ligado a tu cuenta."); return; }
  UID = user ? await user.id().catch(()=>null) : null;
  if(!UID){ gate("No se pudo identificar tu cuenta. Vuelve a iniciar sesión."); return; }
  db = dbx;
  if(owner) await migrateLegacy();
  const sub = (key,col) => db.collection(BASE()+"/"+col).onSnapshot(snap => {
    S[key] = snap.docs.map(d=>({id:d.id,...d.data()}));
    if(!snap.metadata.fromCache) S.ready[key]=true;
    if(!S.engineDone && ["tareas","movs","compras","reglas"].every(k=>S.ready[k])){ S.engineDone=true; runEngine(false); }
    soon();
  }, err => { if(err && (err.code==="not_granted"||/permission|denied/i.test(err.message||""))) gate("Tu acceso a esta app es de solo lectura. Pide a quien te la compartió el rol «Colaborador» para poder guardar tus datos."); else toast("Error de sincronización: "+err.message); });
  for(const [k,c] of Object.entries(COLS)) sub(k,c);
  db.doc(CFGDOC()).onSnapshot(s => { if(s.exists) S.cfg = {...DEF_CFG, ...s.data()}; if(!S.temaPrev){ const t=applyTheme(S.cfg.tema); try{ localStorage.setItem("bpg_tema", JSON.stringify(t)); }catch(_){} } if(!S.cfgSeen){ S.cfgSeen=true; (!S.cfg.bienvenida && !S.cfg.migrado && !fis().sexo) ? welcome() : splash(); } soon(); });
  setInterval(medReminders, 30000); setTimeout(medReminders, 4000);
  db.doc(UIDOC()).onSnapshot(s => { if(!s.exists) return; const u=s.data()||{}; if(u.brief!=null) { S.brief=u.brief; S.briefFecha=u.briefFecha||""; } if(Array.isArray(u.chat) && !S.chatBusy) S.chat=u.chat; if(u.aport!=null && S.aport==null) S.aport=num(u.aport); soon(); }, ()=>{});
}
boot().catch(e=>gate("No se pudo iniciar: "+esc(e.message||e)));
if("serviceWorker" in navigator) window.addEventListener("load", ()=>navigator.serviceWorker.register("../sw.js",{scope:"../"}).catch(()=>{}));
})();
</script>
